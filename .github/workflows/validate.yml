name: Validate portable harness

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      - name: Run layered validation
        run: python3 scripts/validate.py
      - name: Exercise installer dry run
        run: python3 scripts/install.py --target /tmp/cursor-harness-test
      - name: Exercise full profile dry run
        run: python3 scripts/install.py --profile all --target /tmp/cursor-harness-all
