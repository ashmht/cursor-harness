name: Validate portable harness

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run layered validation
        run: python3 scripts/validate.py
      - name: Check shell syntax
        run: bash -n hooks/session-cost.sh
      - name: Exercise installer dry run
        run: python3 scripts/install.py --target /tmp/cursor-harness-test
